name: Build Android

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Android artifact to build
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
          - bundle
      api-url:
        description: Pinkary API base URL baked into the build (debug only, e.g. http://192.168.31.59:8001)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Pinkary Mobile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Point the build at a local API URL (debug testing only)
        if: inputs.api-url != ''
        run: |
          cp .env.example .env
          if grep -q '^PINKARY_API_URL=' .env; then
            sed -i 's|^PINKARY_API_URL=.*|PINKARY_API_URL=${{ inputs.api-url }}|' .env
          else
            echo 'PINKARY_API_URL=${{ inputs.api-url }}' >> .env
          fi
          grep '^PINKARY_API_URL=' .env
          echo "PINKARY_API_URL=${{ inputs.api-url }}" >> $GITHUB_ENV

      - name: Build NativePHP Android application
        id: build
        uses: mrpunyapal/nativephp-build-action@0b2f33cdff551010814ebc7f8fb3f93f2e44887d # v0.2.2
        with:
          platform: android
          build-type: ${{ inputs.build-type }}
          keystore: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Show native compiler errors if packaging produced no APK
        if: failure()
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
        run: |
          if [ -f nativephp/android-build.log ]; then
            tail -n 250 nativephp/android-build.log
          fi
          if [ -f nativephp/android/gradlew ]; then
            cd nativephp/android
            task=assembleRelease
            if [ "$BUILD_TYPE" = bundle ]; then
              task=bundleRelease
            fi
            ./gradlew "$task" --console=plain
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinkary-android-${{ inputs.build-type }}
          path: ${{ steps.build.outputs.artifact }}
