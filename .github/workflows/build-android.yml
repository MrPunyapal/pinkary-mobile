name: Build Android

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Android artifact to build
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
          - bundle
      api-url:
        description: Pinkary API base URL baked into the build (debug only, e.g. http://192.168.31.59:8001)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Pinkary Mobile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Point the build at a local API URL (debug testing only)
        if: inputs.api-url != ''
        run: echo "PINKARY_API_URL=${{ inputs.api-url }}" >> $GITHUB_ENV

      - name: Build NativePHP Android application
        id: build
        uses: mrpunyapal/nativephp-build-action@a3bfe19ed0d12287c38c17701837e41ca39c26be # fix/actions-cache-v4 (PR #2) — re-pin to main after merge
        with:
          platform: android
          build-type: ${{ inputs.build-type }}
          keystore: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinkary-android-${{ inputs.build-type }}
          path: ${{ steps.build.outputs.artifact }}
